
<!DOCTYPE html>
<html>
<head>
    <title>My Ice Cream Shop Menu</title>

    <style>
        body {
            background-color: lightyellow;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: purple;
            text-align: center;
        }

        p {
            color: brown;
        }

        p::first-letter {
            color: red;
            font-size: 25px;
        }

        .menu p {
            background-color: lightblue;
            padding: 10px;
            width: 60%;
            margin: 20px auto;
        }

        .menu p:hover {
            background-color: lawngreen;
        }

        .special {
            color: red;
            font-weight: bold;
        }
        .special::first-letter{
            font-size: 15px;
            color: red;
        }
        .special:hover{
            background-color: red;
            color: black;
            font-weight: bold;
            
        }

        .menu > p {
            border: 1px solid purple;
        }

        h2 + p {
            color: green;
        }
    </style>
</head>

<body>

    <h1>My Ice Cream Shop</h1>

    <h2>Our Menu</h2>

    <div class="menu">
        <p>Vanilla Ice Cream - Rs. 150</p>
        <p class="special">Chocolate Ice Cream - Rs. 200 (Special!)</p>
        <p>Strawberry Ice Cream - Rs. 180</p>
        <p>Mango Ice Cream - Rs. 170</p>
    </div>
    <div class="link">
        <a href="https://bakeryshop.pk/product-category/ice-cream/">Ice Cream</a> 
    </div>
    <br>
    <footer>
        Click above to access our premium website. (50% Off!)
    </footer>
</body>
</html>
